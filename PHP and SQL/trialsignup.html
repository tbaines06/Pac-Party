<body>
<h3>Simple form to gather data: </h3>
<form name="Sign Up" action="trialprocess.php" method="POST">
    <label for="username">Username:</label> 
    <input type="text" id="username" name="username" required="required"><br>

    <label for="password">Password:</label> 
    <input type="password" id="password" name="password" required="required"><br>

    <label for="password_confirmation">Confirm Password:</label>
    <input type="password" id="password_confirmation" name="password_confirmation" required="required"><br>

    <label for="firstname">Firstname:</label>  
    <input type="text" id="firstname" name="firstname" required="required"><br>

    <input type="submit" value="Sign Up">
</form>
</form>
